<!-- src/app/features/store/product-form/product-form.html -->
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/home">Home</a></li>
          <li class="breadcrumb-item"><a [routerLink]="['/loja', storeId]">Loja</a></li>
          <li class="breadcrumb-item active">{{ isEditing ? 'Editar Produto' : 'Novo Produto' }}</li>
        </ol>
      </nav>

      <div class="card border-0 shadow-lg">
        <div class="card-body p-5">
          <h1 class="fw-bold mb-4">
            <i class="bi bi-plus-circle text-primary me-2"></i>
            {{ isEditing ? 'Editar Produto' : 'Adicionar Produto' }}
          </h1>

          <form (ngSubmit)="onSubmit()" #productForm="ngForm">
            <!-- Nome -->
            <div class="form-group mb-3">
              <label class="form-label fw-bold small">Nome do Produto <span class="text-danger">*</span></label>
              <input
                type="text"
                class="form-control"
                placeholder="Ex: iPhone 15 Pro Max"
                [(ngModel)]="product.name"
                name="name"
                required
              />
            </div>

            <!-- Descrição -->
            <div class="form-group mb-3">
              <label class="form-label fw-bold small">Descrição <span class="text-danger">*</span></label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="Descreva seu produto em detalhes"
                [(ngModel)]="product.description"
                name="description"
                required
              ></textarea>
            </div>

            <div class="row g-3">
              <!-- Preço -->
              <div class="col-md-4">
                <label class="form-label fw-bold small">Preço <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text">R$</span>
                  <input
                    type="number"
                    class="form-control"
                    placeholder="0,00"
                    [(ngModel)]="product.price"
                    name="price"
                    step="0.01"
                    required
                  />
                </div>
              </div>

              <!-- Preço Antigo -->
              <div class="col-md-4">
                <label class="form-label fw-bold small">Preço Antigo</label>
                <div class="input-group">
                  <span class="input-group-text">R$</span>
                  <input
                    type="number"
                    class="form-control"
                    placeholder="0,00"
                    [(ngModel)]="product.oldPrice"
                    name="oldPrice"
                    step="0.01"
                  />
                </div>
              </div>

              <!-- Estoque -->
              <div class="col-md-4">
                <label class="form-label fw-bold small">Estoque <span class="text-danger">*</span></label>
                <input
                  type="number"
                  class="form-control"
                  placeholder="Quantidade"
                  [(ngModel)]="product.stock"
                  name="stock"
                  min="1"
                  required
                />
              </div>
            </div>

            <div class="row g-3 mt-2">
              <!-- Categoria -->
              <div class="col-md-6">
                <label class="form-label fw-bold small">Categoria <span class="text-danger">*</span></label>
                <select class="form-select" [(ngModel)]="product.category" name="category" required>
                  <option value="">Selecione uma categoria</option>
                  <option *ngFor="let cat of categories" [value]="cat.slug">
                    <i *ngIf="cat.icon" [class]="'bi ' + cat.icon"></i>
                    {{ cat.name }}
                    <span *ngIf="cat.productCount !== undefined" class="text-muted small">
                      ({{ cat.productCount }})
                    </span>
                  </option>
                </select>
              </div>

              <!-- Condição -->
              <div class="col-md-6">
                <label class="form-label fw-bold small">Condição <span class="text-danger">*</span></label>
                <div class="d-flex gap-3 mt-2">
                  <div class="form-check">
                    <input
                      type="radio"
                      class="form-check-input"
                      id="conditionNew"
                      value="new"
                      [(ngModel)]="product.condition"
                      name="condition"
                    />
                    <label class="form-check-label" for="conditionNew">
                      <i class="bi bi-tag-fill text-success me-1"></i> Novo
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      type="radio"
                      class="form-check-input"
                      id="conditionUsed"
                      value="used"
                      [(ngModel)]="product.condition"
                      name="condition"
                    />
                    <label class="form-check-label" for="conditionUsed">
                      <i class="bi bi-tag-fill text-warning me-1"></i> Usado
                    </label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Localização -->
            <div class="row g-3 mt-2">
              <div class="col-md-6">
                <label class="form-label fw-bold small">Localização <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Cidade - Estado"
                  [(ngModel)]="product.location"
                  name="location"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold small">Frete Grátis</label>
                <div class="form-check form-switch mt-2">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="freeShipping"
                    [(ngModel)]="product.freeShipping"
                    name="freeShipping"
                    style="width: 48px; height: 24px;"
                  />
                  <label class="form-check-label ms-2" for="freeShipping">
                    <i class="bi" [class.bi-check-circle-fill]="product.freeShipping" [class.bi-x-circle-fill]="!product.freeShipping"></i>
                    {{ product.freeShipping ? 'Frete grátis' : 'Frete não incluso' }}
                  </label>
                </div>
              </div>
            </div>

            <!-- Imagens -->
            <div class="mb-3 mt-3">
              <label class="form-label fw-bold small">Imagens <span class="text-danger">*</span></label>
              <p class="text-muted small">Adicione URLs das imagens do produto (máx 5)</p>

              <div *ngFor="let image of imageUrls; let i = index" class="input-group mb-2">
                <span class="input-group-text"><i class="bi bi-image"></i></span>
                <input
                  type="url"
                  class="form-control"
                  [(ngModel)]="imageUrls[i]"
                  [name]="'image' + i"
                  placeholder="https://exemplo.com/imagem.jpg"
                />
                <button
                  type="button"
                  class="btn btn-outline-danger"
                  (click)="removeImageField(i)"
                  *ngIf="imageUrls.length > 1"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>

              <button
                type="button"
                class="btn btn-outline-primary btn-sm"
                (click)="addImageField()"
                [disabled]="imageUrls.length >= 5"
              >
                <i class="bi bi-plus-circle me-1"></i>
                Adicionar imagem
              </button>
              <span class="text-muted ms-2 small">{{ imageUrls.length }}/5</span>
            </div>

            <!-- Botões -->
            <div class="d-flex gap-3 mt-4 pt-3 border-top">
              <button
                type="submit"
                class="btn btn-success btn-lg px-5 rounded-pill"
                [disabled]="loading"
              >
                <span *ngIf="!loading">
                  <i class="bi bi-check-lg me-2"></i>
                  {{ isEditing ? 'Salvar Alterações' : 'Publicar Produto' }}
                </span>
                <span *ngIf="loading">
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  {{ isEditing ? 'Salvando...' : 'Publicando...' }}
                </span>
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary btn-lg px-4 rounded-pill"
                [routerLink]="['/loja', storeId]"
              >
                <i class="bi bi-x-lg me-1"></i>
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
