<!-- src/app/shared/components/comments/comments.html -->
<div class="comments-section">
  <h4 class="fw-bold mb-4">
    <i class="bi bi-chat-dots me-2"></i>
    Comentários
    <span class="badge bg-secondary ms-2">{{ comments.length }}</span>
  </h4>

  <!-- Formulário de Comentário -->
  <div class="comment-form card p-4 mb-4">
    <div class="mb-3">
      <label class="form-label fw-bold">Sua avaliação</label>
      <div class="star-rating">
        <i
          *ngFor="let star of [1,2,3,4,5]"
          class="bi"
          [class.bi-star]="star > rating"
          [class.bi-star-fill]="star <= rating"
          [class.text-warning]="star <= rating"
          (click)="rating = star"
          (mouseenter)="hoverRating = star"
          (mouseleave)="hoverRating = 0"
          [class.hover]="hoverRating >= star"
        ></i>
        <span class="ms-2 text-muted small">
          {{ rating > 0 ? rating + ' estrelas' : 'Selecione uma nota' }}
        </span>
      </div>
    </div>

    <div class="mb-3">
      <textarea
        class="form-control"
        rows="3"
        placeholder="Compartilhe sua opinião sobre este produto..."
        [(ngModel)]="newComment"
        [disabled]="isSubmitting"
      ></textarea>
    </div>

    <div class="d-flex justify-content-end">
      <button
        class="btn btn-primary rounded-pill px-4"
        (click)="submitComment()"
        [disabled]="isSubmitting || !newComment.trim() || rating === 0"
      >
        <span *ngIf="!isSubmitting">
          <i class="bi bi-send me-2"></i>
          Publicar comentário
        </span>
        <span *ngIf="isSubmitting">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Publicando...
        </span>
      </button>
    </div>
  </div>

  <!-- Lista de Comentários -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando comentários...</span>
    </div>
  </div>

  <div *ngIf="!loading && comments.length === 0" class="text-center py-5">
    <i class="bi bi-chat display-1 text-muted"></i>
    <h5 class="mt-3">Nenhum comentário ainda</h5>
    <p class="text-muted">Seja o primeiro a comentar sobre este produto!</p>
  </div>

  <div *ngIf="!loading && comments.length > 0" class="comments-list">
    <div *ngFor="let comment of comments" class="comment-item card p-3 mb-3">
      <div class="d-flex align-items-start gap-3">
        <!-- Avatar -->
        <img
          [src]="comment.userAvatar || 'https://ui-avatars.com/api/?name=' + comment.userName + '&background=667eea&color=fff&size=40'"
          [alt]="comment.userName"
          class="rounded-circle"
          width="40"
          height="40"
        />

        <div class="flex-grow-1">
          <div class="d-flex align-items-center justify-content-between flex-wrap">
            <div>
              <strong class="me-2">{{ comment.userName }}</strong>
              <span class="text-muted small">{{ formatDate(comment.createdAt) }}</span>
              <span *ngIf="comment.updatedAt" class="text-muted small ms-2">
                (editado)
              </span>
            </div>

            <!-- Ações -->
            <div *ngIf="isOwner(comment)" class="comment-actions">
              <button class="btn btn-sm btn-link text-primary" (click)="startEdit(comment)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-link text-danger" (click)="deleteComment(comment.id)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>

          <!-- 🔥 Estrelas - CORRIGIDO -->
          <div class="star-rating-small">
            <ng-container *ngFor="let star of [1,2,3,4,5]">
              <i
                *ngIf="star <= comment.rating"
                class="bi bi-star-fill text-warning"
              ></i>
              <i
                *ngIf="star > comment.rating"
                class="bi bi-star text-muted"
              ></i>
            </ng-container>
          </div>

          <!-- Conteúdo -->
          <div *ngIf="editingCommentId !== comment.id" class="mt-2">
            <p class="mb-0">{{ comment.content }}</p>
          </div>

          <!-- Edição -->
          <div *ngIf="editingCommentId === comment.id" class="mt-2">
            <textarea
              class="form-control mb-2"
              rows="2"
              [(ngModel)]="editingContent"
            ></textarea>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-primary" (click)="saveEdit(comment.id)">
                <i class="bi bi-check me-1"></i>
                Salvar
              </button>
              <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">
                Cancelar
              </button>
            </div>
          </div>

          <!-- Likes -->
          <div class="mt-2 d-flex align-items-center gap-3">
            <button
              class="btn btn-sm btn-link text-muted p-0"
              (click)="toggleLike(comment.id)"
            >
              <i
                class="bi"
                [class.bi-heart]="!comment.isLiked"
                [class.bi-heart-fill]="comment.isLiked"
                [class.text-danger]="comment.isLiked"
              ></i>
              <span class="ms-1">{{ comment.likes }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
